name: Release Android

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read release version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z, got: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split Android APKs
        run: flutter build apk --release --split-per-abi --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_dir="release-assets"
          mkdir -p "$release_dir"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "$release_dir/PlanAct-${GITHUB_REF_NAME}-${abi}.apk"
          done

          (
            cd "$release_dir"
            sha256sum ./*.apk > SHA256SUMS.txt
          )

          zip -9 -j "PlanAct-${GITHUB_REF_NAME}-android-apks.zip" \
            "$release_dir"/*.apk "$release_dir/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
            PlanAct-${{ github.ref_name }}-android-apks.zip
