name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching pubspec.yaml, without the v prefix (for example 0.1.17)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Validate and build Android candidate
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
      ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout immutable dispatch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Validate release version and repository state
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must have the form X.Y.Z: $RELEASE_VERSION" >&2
            exit 1
          fi
          pubspec_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          if [[ "$pubspec_version" != "$RELEASE_VERSION" ]]; then
            echo "Requested version $RELEASE_VERSION does not match pubspec.yaml version $pubspec_version" >&2
            exit 1
          fi
          release_notes="docs/releases/$RELEASE_VERSION.md"
          if [[ ! -s "$release_notes" ]] || ! grep -Fxq "# PlanAct $RELEASE_VERSION release candidate" "$release_notes"; then
            echo "Missing or mismatched release record: $release_notes" >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          {
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_BUILD_NAME=$RELEASE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Print toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          chmod +x android/gradlew
          (cd android && ./gradlew --version)

      - name: Prepare release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing GitHub secret $secret_name." >&2
              exit 1
            fi
          done
          if [[ ! "$ANDROID_SIGNING_CERT_SHA256" =~ ^([[:xdigit:]]{64}|([[:xdigit:]]{2}:){31}[[:xdigit:]]{2})$ ]]; then
            echo "ANDROID_SIGNING_CERT_SHA256 must be a SHA-256 fingerprint." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/planact-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          [[ -s "$keystore_path" ]] || { echo 'Decoded keystore is empty.' >&2; exit 1; }
          keytool -list -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt \
            -srckeystore "$keystore_path" -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/planact-release-validation.jks" \
            -deststoretype JKS -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destalias "$ANDROID_KEY_ALIAS" -destkeypass "$ANDROID_KEY_PASSWORD" >/dev/null
          rm -f "$RUNNER_TEMP/planact-release-validation.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          } >> "$GITHUB_ENV"

      - name: Run shared validation with production signing
        env:
          PLANACT_BUILD_NAME: ${{ inputs.version }}
          PLANACT_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tool/ci.sh

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets build/symbols/universal build/symbols/split
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols/universal \
            --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/PlanAct-${RELEASE_TAG}-universal.apk"
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/symbols/split \
            --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "release-assets/PlanAct-${RELEASE_TAG}-${abi}.apk"
          done

      - name: Verify signed APKs and create checksums
        shell: bash
        run: |
          set -euo pipefail
          certificate_digest=''
          while IFS=' ' read -r variant abi; do
            digest="$(bash .github/scripts/validate_android_release.sh \
              "release-assets/PlanAct-${RELEASE_TAG}-${variant}.apk" "$abi" \
              com.iarash.planact "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER" \
              "$ANDROID_SIGNING_CERT_SHA256")"
            if [[ -z "$certificate_digest" ]]; then certificate_digest="$digest"; elif [[ "$certificate_digest" != "$digest" ]]; then exit 1; fi
          done <<'EOF'
          universal all
          arm64-v8a arm64-v8a
          armeabi-v7a armeabi-v7a
          x86_64 x86_64
          EOF
          printf '%s\n' "$certificate_digest" > release-assets/SIGNING-CERTIFICATE-SHA256.txt
          (cd release-assets && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Encrypt obfuscation symbols
        shell: bash
        env:
          SYMBOLS_ENCRYPTION_PASSPHRASE: ${{ secrets.SYMBOLS_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$SYMBOLS_ENCRYPTION_PASSPHRASE" ]] || { echo 'Missing SYMBOLS_ENCRYPTION_PASSPHRASE.' >&2; exit 1; }
          for variant in universal split; do
            find "build/symbols/$variant" -type f -size +0c -print -quit | grep -q .
          done
          archive="$RUNNER_TEMP/PlanAct-${RELEASE_TAG}-symbols.tar.gz"
          passphrase_file="$RUNNER_TEMP/planact-symbols-passphrase"
          umask 077
          tar -czf "$archive" -C build/symbols universal split
          printf '%s' "$SYMBOLS_ENCRYPTION_PASSPHRASE" > "$passphrase_file"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" --symmetric --cipher-algo AES256 --output "$archive.gpg" "$archive"
          rm -f "$passphrase_file" "$archive"

      - name: Upload encrypted symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlanAct-${{ env.RELEASE_TAG }}-symbols-encrypted
          path: ${{ runner.temp }}/PlanAct-${{ env.RELEASE_TAG }}-symbols.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          cp "docs/releases/$RELEASE_VERSION.md" release-assets/RELEASE-NOTES.md
          (cd release-assets && sha256sum RELEASE-NOTES.md > RELEASE-NOTES-SHA256.txt)
          printf 'commit=%s\nrun_id=%s\nversion=%s\nversion_code=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER" > release-assets/BUILD-IDENTITY.txt
          {
            echo "## Android candidate $RELEASE_TAG"
            echo "Commit: $GITHUB_SHA; run: $GITHUB_RUN_ID; versionCode: $RELEASE_BUILD_NUMBER"
            echo 'Solo-maintainer release: the exact candidate is published automatically after technical validation. This does not establish independent product or device acceptance.'
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: PlanAct-${{ env.RELEASE_TAG }}-candidate-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified candidate without rebuilding
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: PlanAct-${{ needs.release.outputs.tag }}-candidate-${{ github.run_id }}
          path: release-assets

      - name: Verify identity and checksums, then publish
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          grep -Fx "commit=$GITHUB_SHA" BUILD-IDENTITY.txt
          grep -Fx "run_id=$GITHUB_RUN_ID" BUILD-IDENTITY.txt
          grep -Fx "version=$RELEASE_VERSION" BUILD-IDENTITY.txt
          grep -Fx "version_code=$GITHUB_RUN_NUMBER" BUILD-IDENTITY.txt
          sha256sum -c SHA256SUMS.txt
          sha256sum -c RELEASE-NOTES-SHA256.txt
          grep -Fxq "# PlanAct $RELEASE_VERSION release candidate" RELEASE-NOTES.md
          printf '\n## Published build identity\n\nCommit: %s; Actions run: %s; Android versionCode: %s. APKs are signed and technically verified; this is not independent product acceptance. See SHA256SUMS.txt and BUILD-IDENTITY.txt.\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" >> RELEASE-NOTES.md
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlanAct $RELEASE_TAG" \
            --notes-file RELEASE-NOTES.md \
            ./*.apk SHA256SUMS.txt SIGNING-CERTIFICATE-SHA256.txt BUILD-IDENTITY.txt
