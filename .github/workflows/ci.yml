name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      refresh_linux_goldens:
        description: 'Explicitly regenerate Linux brand baselines on a non-default branch; review the image diff before merging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate Flutter and Android release build
    if: ${{ !inputs.refresh_linux_goldens }}
    # Keep the golden reference OS aligned with the explicit refresh job below.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Print toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          chmod +x android/gradlew
          (cd android && ./gradlew --version)

      - name: Configure ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/planact-ci.jks"
          keytool -genkeypair -v \
            -keystore "$keystore_path" \
            -storepass ci-password \
            -keypass ci-password \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=PlanAct CI, OU=CI, O=PlanAct, L=Local, S=Local, C=US"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo 'ANDROID_KEYSTORE_PASSWORD=ci-password'
            echo 'ANDROID_KEY_ALIAS=ci'
            echo 'ANDROID_KEY_PASSWORD=ci-password'
          } >> "$GITHUB_ENV"

      - name: Run shared validation
        env:
          PLANACT_BUILD_NAME: ci
          PLANACT_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tool/ci.sh

      - name: Upload golden test failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  refresh-linux-goldens:
    name: Explicit Linux golden refresh
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_linux_goldens }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Reject default branch and tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH"

      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Flutter matching validation
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      # Same OS, Flutter version, locked dependencies and gallery as normal CI.
      # Updating baselines is allowed only in this explicit, reviewable job.
      - name: Generate and verify exact Linux baselines
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          flutter test --no-pub --update-goldens test/widget/brand_theme_test.dart --reporter expanded
          flutter test --no-pub test/widget/brand_theme_test.dart --reporter expanded
          git diff --check

      - name: Retain Linux images for visual review
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-linux-brand-goldens
          path: test/widget/goldens/linux/brand_*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit only Linux baselines to selected branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- test/widget/goldens/linux/brand_light.png test/widget/goldens/linux/brand_dark.png
          if git diff --cached --quiet; then
            echo 'Linux baselines already match.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh Linux brand goldens with CI toolchain'
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo 'Linux baselines refreshed. Review both images and run CI again with refresh disabled. Bot pushes do not trigger PR checks.' >> "$GITHUB_STEP_SUMMARY"
