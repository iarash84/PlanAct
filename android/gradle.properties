# Bound build memory on 8 GB hosts; Dart and JVM native memory need headroom too.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Use Gradle's built-in Kotlin support so plugins do not need to apply KGP.
android.builtInKotlin=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# Keep versionCode identical across universal and ABI-split APKs.
force-version-code-ignoring-abi=true
