# Leave memory available for the separate Dart compiler on 8 GB development machines.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Use Gradle's built-in Kotlin support so plugins do not need to apply KGP.
android.builtInKotlin=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# Keep versionCode identical across universal and ABI-split APKs.
force-version-code-ignoring-abi=true
